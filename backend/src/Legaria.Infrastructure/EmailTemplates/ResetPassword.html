<!doctype html>
<html lang="es">
  <body style="margin:0;background:#f5f7fb;font-family:Arial,sans-serif;color:#172033">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding:32px 16px">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#fff;border-radius:16px">
            <tr><td style="padding:32px">
              <p style="margin:0 0 8px;color:#316bff;font-weight:700">LEGARIA</p>
              <h1 style="margin:0 0 20px;font-size:24px">Restablece tu contraseña</h1>
              <p>Hola {{FirstName}}, recibimos una solicitud para cambiar tu contraseña.</p>
              <p style="margin:28px 0">
                <a href="{{ActionUrl}}" style="background:#316bff;color:#fff;text-decoration:none;padding:13px 22px;border-radius:9px;display:inline-block">Crear nueva contraseña</a>
              </p>
              <p style="font-size:14px;color:#5f687a">Este enlace vence en {{ExpirationTime}}. Si no solicitaste el cambio, no necesitas hacer nada.</p>
              <p style="font-size:13px;color:#7d8491">Soporte: {{SupportEmail}}</p>
            </td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
